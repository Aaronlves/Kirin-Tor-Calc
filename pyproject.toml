[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kirin-tor-cli"
version = "0.2.0"
description = "A game-neutral, file-driven structured mathematics CLI for theorycrafting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kirin Tor contributors" }]
dependencies = [
  "matplotlib>=3.8,<3.10",
  "sympy>=1.13,<1.15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
tui = [
  "plotext>=6,<7",
  "textual>=8.2,<8.3",
]

[project.scripts]
kt = "kirin_tor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kirin_tor.packages" = ["*.kirin"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
