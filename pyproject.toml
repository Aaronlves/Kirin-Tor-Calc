[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kirin-tor-cli"
version = "0.6.0"
description = "A game-neutral, file-driven theorycrafting CLI and local browser workbench"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kirin Tor contributors" }]
dependencies = [
  "matplotlib>=3.11,<3.12",
  "mcp>=2.1,<3",
  "sympy>=1.13,<1.15",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/Aaronlves/Kirin-Tor-Calc"
Repository = "https://github.com/Aaronlves/Kirin-Tor-Calc"
Issues = "https://github.com/Aaronlves/Kirin-Tor-Calc/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
kt = "kirin_tor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kirin_tor = [
  "web_assets/*.html",
  "web_assets/*.css",
  "web_assets/*.js",
  "protocol_assets/*.json",
  "protocol_assets/*.mjs",
  "protocol_assets/*.d.mts",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
