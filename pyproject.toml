[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kirin-tor-cli"
version = "0.4.0"
description = "A game-neutral, file-driven theorycrafting CLI and local browser workbench"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kirin Tor contributors" }]
dependencies = [
  "matplotlib>=3.8,<3.10",
  "sympy>=1.13,<1.15",
  "tomli>=2,<3; python_version < '3.11'",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/Aaronlves/Kirin-Tor-Calc"
Repository = "https://github.com/Aaronlves/Kirin-Tor-Calc"
Issues = "https://github.com/Aaronlves/Kirin-Tor-Calc/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
kt = "kirin_tor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kirin_tor = [
  "tutorial_sources/*.kirin",
  "web_assets/*.html",
  "web_assets/*.css",
  "web_assets/*.js",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
