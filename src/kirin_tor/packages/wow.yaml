schema_version: 1
id: wow_semantics
name: 魔兽世界基础数学语义
type: entry
template: semantics
description: >-
  Data-only starter declarations for World of Warcraft workspaces. These
  declarations use the same public schema as user-authored entries and have no
  privileged runtime behavior.
game_version: generic
validation_status: bundled_starter
semantics:
  dimensions:
    time:
      name: 时间
    damage:
      name: 伤害
    attack_power:
      name: 攻击强度
    healing:
      name: 治疗
    armor:
      name: 护甲
    resource:
      name: 资源
  units:
    time:
      dimensions: {time: 1}
    damage:
      dimensions: {damage: 1}
    attack_power:
      dimensions: {attack_power: 1}
    healing:
      dimensions: {healing: 1}
    armor:
      dimensions: {armor: 1}
    resource:
      dimensions: {resource: 1}
    damage_per_time:
      dimensions: {damage: 1, time: -1}
    damage_per_attack_power:
      dimensions: {damage: 1, attack_power: -1}
  domains:
    probability:
      value_type: number
      unit: dimensionless
      min: "0"
      max: "1"
    nonnegative_integer:
      value_type: number
      unit: dimensionless
      min: "0"
      integer: true
inputs: {}
constraints: []
fields: {}
functions: {}
outputs: {}
