name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/generate_plugin_protocol.py --check
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          KIRIN_PYTHON: python
      - run: npm run test:bundle
        working-directory: frontend
      - run: diff -qr frontend/dist src/kirin_tor/web_assets
      - run: python scripts/benchmark_workbench.py --documents 100 --budget-seconds 8

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Seed files from an obsolete package layout
        run: |
          mkdir -p build/lib/kirin_tor/packages build/lib/kirin_tor/web_assets
          touch build/lib/kirin_tor/tui.py
          touch build/lib/kirin_tor/packages/wow.yaml
          touch build/lib/kirin_tor/web_assets/app.js
      - run: python -m build --wheel --outdir wheelhouse
      - run: python scripts/check_wheel_contents.py wheelhouse/*.whl
